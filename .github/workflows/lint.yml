name: lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 'self-test: check built-in configs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'Run zbp-app-lint (check mode on config/)'
        uses: ./
        with:
          path: 'config'
          changed-only: 'false'

  fix-smoke:
    name: 'self-test: fix mode on fixtures'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: 'Run zbp-app-lint (fix mode on tests/fixtures/)'
        uses: ./
        with:
          path: 'tests/fixtures'
          mode: 'fix'
          changed-only: 'false'

      - name: 'Verify fixtures were actually fixed'
        run: |
          if git diff --quiet -- tests/fixtures; then
            echo '::error::fix mode produced no changes on fixtures, expected fixes'
            exit 1
          fi
          git diff -- tests/fixtures

      - name: 'Run zbp-app-lint again (check mode must pass now)'
        uses: ./
        with:
          path: 'tests/fixtures'
          mode: 'check'
          changed-only: 'false'

  incremental-shortcircuit:
    name: 'self-test: incremental mode short-circuits with an empty list'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: 'Run lint.sh with an empty ZBP_LINT_CHANGED_FILES'
        env:
          ZBP_LINT_CHANGED_FILES: ''
          GITHUB_ACTIONS: 'true'
        run: |
          bash scripts/lint.sh --path config --mode check --changed-only true
